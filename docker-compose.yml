# Ferronit — run the image with a single command.
#
#   docker compose up --build api           # minimal app (port 8000)
#   docker compose --profile postgres up --build ecommerce   # DDD example on Postgres (port 8001)
#   docker compose --profile postgres up -d  # Postgres 18 alongside (port 5432)
#
# ecommerce uses Postgres from the `postgres` profile (DATABASE_URL is preconfigured).

services:
  api:
    build: .
    image: ferronit:0.24.0
    ports:
      - "8000:8000"
    environment:
      APP: demo_app:app
      WORKERS: "2"
      PORT: "8000"
    restart: unless-stopped

  # examples/app.py — e-commerce with DDD/CQRS (Postgres from the `postgres` profile)
  ecommerce:
    build: .
    image: ferronit:0.24.0
    ports:
      - "8001:8000"
    environment:
      APP: examples.app:app
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ferronit
      HEALTH_PATH: /cart
      WORKERS: "1"
    working_dir: /app
    depends_on:
      - postgres
    command:
      - sh
      - -c
      - >-
        python -c "import asyncio, examples.app as a; asyncio.run(a.init_db())"
        && exec ferronit-entrypoint

  postgres:
    image: postgres:18-alpine
    profiles: ["postgres"]
    # 5433 on the host: does not clash with the local Postgres/test ferronit-pg on 5432
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: ferronit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
