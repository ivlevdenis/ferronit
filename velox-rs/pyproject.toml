[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "velox-core"
dynamic = ["version"]
description = "Native Rust core for the Velox ASGI web framework (routing, JSON, gzip, CORS)"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
]

[tool.maturin]
# Импортируется как `velox_core` (top-level) — под этим именем его ждёт
# velox/core/request.py, response.py, app.py.
module-name = "velox_core"
bindings = "pyo3"
# Сборка с abi3-py39: один wheel на все CPython >= 3.9 (тег cp39-abi3),
# вместо матрицы cp312/cp313/cp314. См. Cargo.toml [dependencies] pyo3.
features = ["pyo3/extension-module"]
strip = true
