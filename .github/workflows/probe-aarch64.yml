# ВРЕМЕННЫЙ пробник: подбираем рабочую конфигурацию сборки для aarch64 (ring не собирается
# кросс-компилятором на старом manylinux2014). После подбора файл удаляется.
name: probe-aarch64

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-aarch64.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "aarch64 @ manylinux 2_28"
            target: aarch64
            manylinux: "2_28"
            before: ""
            extra: ""
          - name: "aarch64 @ auto + zig"
            target: aarch64
            manylinux: "auto"
            before: "python3 -m pip install ziglang"
            extra: "--zig"
          - name: "aarch64 @ 2_28 + zig"
            target: aarch64
            manylinux: "2_28"
            before: "python3 -m pip install ziglang"
            extra: "--zig"
          - name: "x86_64 @ manylinux 2_28"
            target: x86_64
            manylinux: "2_28"
            before: ""
            extra: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Сборка колеса
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: ${{ matrix.before }}
          args: --release --out dist ${{ matrix.extra }}
      - name: Что получилось
        run: ls -lh dist
