[package]
name = "rust_http_bench"
version = "0.1.0"
edition = "2021"
publish = false

# HTTP-стенд на Rust-фреймворках: Axum и Actix Web.
# Тот же контракт и та же таблица, что у Python/Go-стендов (bench/api_bench.py):
#   GET /ping, GET /rows?limit=N, POST /rows, PUT /rows/{id}, DELETE /rows/{id}, POST /rows/upsert.
# Слой доступа у обоих одинаковый — sqlx + Postgres, чтобы разница была ценой фреймворка,
# а не ORM (Go-стенд закрывает сравнение слоёв).

[lib]
path = "src/lib.rs"

[[bin]]
name = "axum_srv"
path = "src/bin/axum_srv.rs"

[[bin]]
name = "actix_srv"
path = "src/bin/actix_srv.rs"

[dependencies]
axum = "0.8"
actix-web = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
