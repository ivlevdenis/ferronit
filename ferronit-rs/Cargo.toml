[package]
name = "ferronit-core"
version = "0.24.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "ferronit_core"
crate-type = ["cdylib"]

[dependencies]
# abi3-py312: stable CPython ABI — one wheel works on 3.12+ (including 3.15),
# no separate build per Python version. Below 3.10 PyUnicode_AsUTF8AndSize is
# unavailable (needed by PyString::to_str), and Ferronit's Python layer
# already requires >=3.12 — the cp312-abi3 tag covers the whole supported range.
# extension-module is required to build the .so without linking libpython.
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py312"] }
matchit = "0.8"
flate2 = "1"
