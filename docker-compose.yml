# Ferronit — запуск образа «одной командой».
#
#   docker compose up --build api           # минимальное приложение (порт 8000)
#   docker compose --profile postgres up --build ecommerce   # DDD-пример на Postgres (порт 8001)
#   docker compose --profile postgres up -d  # Postgres 18 рядом (порт 5432)
#
# ecommerce работает с Postgres из профиля `postgres` (DATABASE_URL уже настроен).

services:
  api:
    build: .
    image: ferronit:0.15.0
    ports:
      - "8000:8000"
    environment:
      APP: demo_app:app
      WORKERS: "2"
      PORT: "8000"
    restart: unless-stopped

  # examples/app.py — e-commerce с DDD/CQRS (Postgres из профиля `postgres`)
  ecommerce:
    build: .
    image: ferronit:0.15.0
    ports:
      - "8001:8000"
    environment:
      APP: examples.app:app
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ferronit
      HEALTH_PATH: /cart
      WORKERS: "1"
    working_dir: /app
    depends_on:
      - postgres
    command:
      - sh
      - -c
      - >-
        python -c "import asyncio, examples.app as a; asyncio.run(a.init_db())"
        && exec ferronit-entrypoint

  postgres:
    image: postgres:18-alpine
    profiles: ["postgres"]
    # 5433 на хосте: не конфликтует с локальным Postgres/тестовым ferronit-pg на 5432
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: ferronit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
