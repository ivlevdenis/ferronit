[project]
name = "ferronit"
dynamic = ["version"]
description = "Fast replacement for legacy Python web services that can't handle the load — routing, JSON and PostgreSQL in Rust, handlers stay plain Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Single package: the native core (ferronit._core) is built into this wheel.
# Exactly one required runtime dependency — msgspec (fast JSON/validation).
# DB drivers are extras: the data layer (rawdb/rawmodel/drivers) imports the driver
# lazily, on pool creation, so `import ferronit.contrib.rawdb` works without them.
dependencies = ["msgspec>=0.19"]
classifiers = [
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.scripts]
ferronit = "ferronit.cli:main"

[project.optional-dependencies]
server = ["granian[reload]>=2.8", "uvicorn[standard]>=0.30"]
pydantic = ["pydantic>=2.0"]
# DB drivers are extras. The data layer (rawdb/rawmodel) works on three engines and
# imports the driver only on pool creation: without the extra the modules still import,
# while `create_pool` reports what to install. Backend tests:
# tests/test_backends_repository.py (+ test_sql_backends.py); SQLite is an in-process
# library, MySQL is the ferronit-mysql container (scripts/dbs_up.sh).
postgres = ["asyncpg>=0.29"]
sqlite = ["aiosqlite>=0.20"]
mysql = ["aiomysql>=0.2"]
# Mirrors the Poetry group below — for installing without Poetry: pip install "ferronit[dev]".
# asyncpg is here so the suite does not skip rawdb/rawmodel tests.
dev = ["pytest>=8", "pytest-asyncio", "pytest-benchmark", "httpx", "maturin>=1.14,<2",
       "ruff>=0.6", "mypy>=1.11", "asyncpg>=0.29"]

# ── Poetry ────────────────────────────────────────────────────────────
# Poetry manages the environment and dependencies. Poetry does not install the
# project itself (package-mode = false), because maturin builds the wheel with the Rust core:
#   poetry install --all-extras && poetry run maturin develop --release
[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-asyncio = "*"
pytest-benchmark = "*"
httpx = "*"
maturin = ">=1.14,<2"
ruff = ">=0.6"
mypy = ">=1.11"

[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[tool.maturin]
# Single package: Python `ferronit/` and the native core are built into one wheel. The Rust crate lives
# in ferronit-rs/ and is built as `ferronit._core`. Version comes from ferronit-rs/Cargo.toml.
manifest-path = "ferronit-rs/Cargo.toml"
module-name = "ferronit._core"
bindings = "pyo3"
python-source = "."
python-packages = ["ferronit"]
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ── Linter ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv", "build", "dist", "ferronit-rs/target",
    "graphify-out", "infographic",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PERF", "RUF", "S110", "S112"]
ignore = [
    "E501",   # line length is kept in check while reading, not by the linter
    "B008",   # app.use(cors()) — a call in a default argument is intentional
    "RUF012", # ClassVar for mutable attributes: this code has no such pattern
    "RUF002", "RUF003",  # typographic em dashes and Russian notes in docstrings/comments
    "B024",   # Port/Adapter — marker interfaces without methods (intentional)
]

[tool.ruff.lint.per-file-ignores]
# The security set deliberately exercises "bad" constructs (injections, malformed input)
"tests/security/*.py" = ["S", "E501"]
# Tuple unpacking in tests for readability (some values are unused)
"tests/**/*.py" = ["RUF059"]

# ── Types ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
files = ["ferronit"]
show_error_codes = true
show_column_numbers = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
pretty = true

# Optional dependencies: stubs do not exist — imports are not treated as errors
[[tool.mypy.overrides]]
module = ["aiokafka.*", "aiokafka", "asyncpg.*", "qdrant_client.*", "chromadb.*",
          "aiomysql.*", "aiomysql", "aiosqlite.*", "aiosqlite"]
ignore_missing_imports = true
