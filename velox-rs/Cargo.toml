[package]
name = "velox-core"
version = "0.8.0"
edition = "2021"

[lib]
name = "velox_core"
crate-type = ["cdylib"]

[dependencies]
# abi3-py312: стабильный ABI CPython — один wheel работает на 3.12+ (включая 3.14),
# не нужна отдельная сборка под каждую версию Python. Ниже 3.10 недоступен
# PyUnicode_AsUTF8AndSize (нужен для PyString::to_str), а Python-слой Velox и так
# требует >=3.12 — тег cp312-abi3 покрывает весь поддерживаемый диапазон.
# extension-module обязателен для сборки .so без линковки с libpython.
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py312"] }
matchit = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
