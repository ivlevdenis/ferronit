# Ferronit release: checks → wheels for all platforms → GitHub Release → PyPI.
#
#   git tag -a v0.24.0 -m "Ferronit 0.24.0" && git push origin v0.24.0
#
# Trigger — a v* tag; workflow_dispatch runs checks and the build without publishing.
# Publishing to PyPI — via the API token from the repository secret PYPI_API_TOKEN.
# Alternative — Trusted Publishing (OIDC, no secret): then password: '' is needed here
# and a pending publisher on pypi.org: project ferronit, owner ivlevdenis, repo ferronit,
# workflow release.yml, environment release.
#
# maturin (PyO3/maturin-action) builds the wheel with the Rust core, Poetry manages the environment.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tag version must match the version in Cargo.toml and ferronit/__init__.py,
  # then the standard scripts/check.sh runs (ruff → docstrings → mypy → core → tests).
  check:
    name: Checks and tests
    runs-on: ubuntu-latest
    services:
      # tests/test_rawdb.py, tests/test_rawmodel.py and tests/test_postgres_real.py talk to a live PostgreSQL :5432
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # The MySQL dialect is verified by a live run: tests/test_backends_repository.py,
      # tests/test_sql_backends.py (tests are skipped without the service), SQLite is in-process.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ferronit_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FERRONIT_TEST_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      FERRONIT_TEST_MYSQL_HOST: 127.0.0.1
      FERRONIT_TEST_MYSQL_PORT: "3306"
      FERRONIT_TEST_MYSQL_USER: root
      FERRONIT_TEST_MYSQL_PASSWORD: root
      FERRONIT_TEST_MYSQL_DB: ferronit_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tag version = Cargo.toml = ferronit.__version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo="$(grep -m1 '^version' ferronit-rs/Cargo.toml | cut -d'"' -f2)"
          pyver="$(grep -m1 '__version__' ferronit/__init__.py | cut -d'"' -f2)"
          echo "tag=$tag Cargo.toml=$cargo ferronit/__init__.py=$pyver"
          if [ "$tag" != "$cargo" ] || [ "$tag" != "$pyver" ]; then
            echo "::error::tag version ($tag) does not match Cargo.toml ($cargo) / __init__.py ($pyver)"
            exit 1
          fi

      - name: Install Poetry and the environment
        run: |
          python -m venv /tmp/poetry-venv
          /tmp/poetry-venv/bin/pip install --quiet poetry
          echo "/tmp/poetry-venv/bin" >> "$GITHUB_PATH"
          # in this same step poetry is not yet in PATH (GITHUB_PATH affects later steps) — use the explicit path
          /tmp/poetry-venv/bin/poetry install --all-extras

      - name: Lint, types, core and tests
        run: ./scripts/check.sh

  linux:
    name: Linux (glibc)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Wheels (maturin, abi3-py312)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          # 2_28, not auto: for target=aarch64 auto picks manylinux2014-cross, where the old
          # assembler cannot build ring (chacha-armv8-linux64.S) — the job failed on cc-rs.
          # Verified with a probe: 2_28 builds both aarch64 and x86_64; wheel tags are consistent.
          manylinux: 2_28
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  musllinux:
    name: Linux (musl)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Wheels (maturin, abi3-py312)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist

  windows:
    name: Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - name: Wheels (maturin, abi3-py312)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    name: macOS
    # Both wheels are built by one Intel runner: x86_64 is a native build, aarch64 is a
    # cross build (`--target aarch64-apple-darwin`; the macOS SDK is universal, and PyO3
    # with abi3-py312 does not require an interpreter of the target architecture,
    # maturin-action installs rustup-target and SDKROOT itself). Previously arm64 was built on
    # `macos-latest`, but on 2026-11-02 that job twice failed to get a runner and was
    # cancelled after 15 minutes — "The job was not acquired by Runner of type
    # hosted even after multiple attempts" + "capacity constraints … macOS arm64
    # runners". Because of it 0.24.0 never shipped: the release waits for all matrix jobs.
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Wheels (maturin, abi3-py312)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Sources (LICENSE, Cargo.lock inside)
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist

  release:
    name: GitHub Release and PyPI
    runs-on: ubuntu-latest
    needs: [check, linux, musllinux, windows, macos, sdist]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    environment: release
    permissions:
      id-token: write        # Trusted Publishing to PyPI + artifact attestation
      contents: write        # creating the release
      attestations: write
    steps:
      # checkout is needed so gh can determine the repository (otherwise "not a git repository")
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: What was built
        run: ls -lh dist

      - name: Artifact provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI (API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          # a repeated release run must not fail on "file already exists"
          skip-existing: true

      - name: GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          echo "repo=$GITHUB_REPOSITORY tag=$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ferronit ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/*
