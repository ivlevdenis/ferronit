# Test databases for the Ferronit data-layer dialects.
#
#   ./scripts/dbs_up.sh up        # start and wait for readiness (docker compose --wait)
#   ./scripts/dbs_up.sh status    # what is running
#   ./scripts/dbs_up.sh down      # stop
#
# Why this layout:
#   * MySQL 8.4 on host :3307 (3306 is often taken by a local server; the test
#     Postgres lives on :5432 in the velox-pg container — see tests/test_rawdb.py);
#   * SQLite is a library, not a server: it needs no container, tests run it
#     through aiosqlite in-process (tests/test_sql_backends.py);
#   * the Postgres container is not duplicated here: the existing data-layer
#     tests already use it (DSN postgres:postgres@localhost:5432/postgres).
#
# The root:root user/password and the ferronit_test database are for tests only.

services:
  mysql:
    image: mysql:8.4
    container_name: ferronit-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ferronit_test
      # utf8mb4 + *_ci: ILIKE-like case-insensitive LIKE behaviour,
      # as the MySQL dialect expects (see ferronit/contrib/sqlast.py).
      MYSQL_ROOT_HOST: "%"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
