# Релиз Ferrox: проверки → колеса под все платформы → GitHub Release → PyPI.
#
#   git tag -a v0.8.1 -m "Ferrox 0.8.1" && git push origin v0.8.1
#
# Триггер — тег вида v*; workflow_dispatch запускает проверки и сборку без публикации.
# Публикация на PyPI идёт по Trusted Publishing (OIDC), токен не нужен:
# на pypi.org → Publishing → Add a new pending publisher → owner/ivlevdenis,
# repo/ferrox, workflow/release.yml, environment/release.
#
# Сборку колеса с Rust-ядром делает maturin (PyO3/maturin-action), окружение — Poetry.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Версия тега должна совпасть с версией в Cargo.toml и ferrox/__init__.py,
  # затем прогоняется штатный scripts/check.sh (ruff → докстринги → mypy → ядро → тесты).
  check:
    name: Проверки и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Версия тега = Cargo.toml = ferrox.__version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo="$(grep -m1 '^version' ferrox-rs/Cargo.toml | cut -d'"' -f2)"
          pyver="$(grep -m1 '__version__' ferrox/__init__.py | cut -d'"' -f2)"
          echo "тег=$tag Cargo.toml=$cargo ferrox/__init__.py=$pyver"
          if [ "$tag" != "$cargo" ] || [ "$tag" != "$pyver" ]; then
            echo "::error::версия тега ($tag) не совпадает с Cargo.toml ($cargo) / __init__.py ($pyver)"
            exit 1
          fi

      - name: Установка Poetry и окружения
        run: |
          python -m venv /tmp/poetry-venv
          /tmp/poetry-venv/bin/pip install --quiet poetry
          echo "/tmp/poetry-venv/bin" >> "$GITHUB_PATH"
          poetry install --all-extras

      - name: Линт, типы, ядро и тесты
        run: ./scripts/check.sh

  linux:
    name: Linux (glibc)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Колёса (maturin, abi3-py312)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  musllinux:
    name: Linux (musl)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Колёса (maturin, abi3-py312)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist

  windows:
    name: Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - name: Колёса (maturin, abi3-py312)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    name: macOS
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Колёса (maturin, abi3-py312)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Исходники (LICENSE, Cargo.lock внутри)
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist

  release:
    name: GitHub Release и PyPI
    runs-on: ubuntu-latest
    needs: [check, linux, musllinux, windows, macos, sdist]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    environment: release
    permissions:
      id-token: write        # Trusted Publishing на PyPI + артефакт-аттестация
      contents: write        # создание релиза
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Что собрано
        run: ls -lh dist

      - name: Аттестация происхождения артефактов
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - name: Публикация на PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Если вместо OIDC используешь токен — убери environment и добавь:
          #   password: ${{ secrets.PYPI_API_TOKEN }}

      - name: GitHub Release с артефактами
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Ferrox ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/*
