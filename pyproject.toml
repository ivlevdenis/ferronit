[project]
name = "velox"
version = "0.1.0"
description = "High-performance Python ASGI web framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
velox = "velox.cli:main"

[project.optional-dependencies]
full = ["uvloop>=0.21"]
dev = ["pytest>=8", "pytest-asyncio", "pytest-benchmark", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
