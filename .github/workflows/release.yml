# Релиз Ferronit: проверки → колеса под все платформы → GitHub Release → PyPI.
#
#   git tag -a v0.10.0 -m "Ferronit 0.10.0" && git push origin v0.10.0
#
# Триггер — тег вида v*; workflow_dispatch запускает проверки и сборку без публикации.
# Публикация на PyPI — по API-токену из секрета репозитория PYPI_API_TOKEN.
# Альтернатива — Trusted Publishing (OIDC, без секрета): тогда здесь нужен password: ''
# и на pypi.org pending publisher: project ferronit, owner ivlevdenis, repo ferronit,
# workflow release.yml, environment release.
#
# Сборку колеса с Rust-ядром делает maturin (PyO3/maturin-action), окружение — Poetry.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Версия тега должна совпасть с версией в Cargo.toml и ferronit/__init__.py,
  # затем прогоняется штатный scripts/check.sh (ruff → докстринги → mypy → ядро → тесты).
  check:
    name: Проверки и тесты
    runs-on: ubuntu-latest
    services:
      # tests/test_ferronit_db.py и tests/test_postgres_real.py ходят в живой PostgreSQL :5432
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Версия тега = Cargo.toml = ferronit.__version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo="$(grep -m1 '^version' ferronit-rs/Cargo.toml | cut -d'"' -f2)"
          pyver="$(grep -m1 '__version__' ferronit/__init__.py | cut -d'"' -f2)"
          echo "тег=$tag Cargo.toml=$cargo ferronit/__init__.py=$pyver"
          if [ "$tag" != "$cargo" ] || [ "$tag" != "$pyver" ]; then
            echo "::error::версия тега ($tag) не совпадает с Cargo.toml ($cargo) / __init__.py ($pyver)"
            exit 1
          fi

      - name: Установка Poetry и окружения
        run: |
          python -m venv /tmp/poetry-venv
          /tmp/poetry-venv/bin/pip install --quiet poetry
          echo "/tmp/poetry-venv/bin" >> "$GITHUB_PATH"
          # в этом же шаге poetry ещё нет в PATH (GITHUB_PATH влияет на следующие шаги) — путь явный
          /tmp/poetry-venv/bin/poetry install --all-extras

      - name: Линт, типы, ядро и тесты
        run: ./scripts/check.sh

  linux:
    name: Linux (glibc)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Колёса (maturin, abi3-py312)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          # 2_28, а не auto: для target=aarch64 auto выбирает manylinux2014-cross, где старый
          # ассемблер не собирает ring (chacha-armv8-linux64.S) — джоба падала на cc-rs.
          # Проверено пробником: 2_28 собирает и aarch64, и x86_64; теги колёс согласованы.
          manylinux: 2_28
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  musllinux:
    name: Linux (musl)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Колёса (maturin, abi3-py312)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist

  windows:
    name: Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - name: Колёса (maturin, abi3-py312)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    name: macOS
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Колёса (maturin, abi3-py312)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Исходники (LICENSE, Cargo.lock внутри)
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist

  release:
    name: GitHub Release и PyPI
    runs-on: ubuntu-latest
    needs: [check, linux, musllinux, windows, macos, sdist]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    environment: release
    permissions:
      id-token: write        # Trusted Publishing на PyPI + артефакт-аттестация
      contents: write        # создание релиза
      attestations: write
    steps:
      # checkout нужен, чтобы gh мог определить репозиторий (иначе «not a git repository»)
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Что собрано
        run: ls -lh dist

      - name: Аттестация происхождения артефактов
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - name: Публикация на PyPI (API-токен)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          # повторный прогон релиза не должен падать на «файл уже существует»
          skip-existing: true

      - name: GitHub Release с артефактами
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          echo "repo=$GITHUB_REPOSITORY tag=$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ferronit ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/*
